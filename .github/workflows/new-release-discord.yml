name: Discord Release Webhook

on:
  release:
    types: [published]

jobs:
  releaseNotification:
    if: github.event.release.prerelease == false && secrets.DISCORD_RELEASE_WEBHOOK != ''
    name: Notify Discord - New Release
    runs-on: ubuntu-latest
    steps:
      - name: Send release embed to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_RELEASE_ROLE_ID || secrets.DISCORD_ROLE_ID }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          ACTOR: ${{ github.actor }}
          TIMESTAMP: ${{ github.event.release.published_at }}
        run: |
          DESC="${BODY}"
          if [ ${#DESC} -gt 3800 ]; then
            DESC="${DESC:0:3800}"$'\n\n'"…(truncated; open the release for full notes)"
          fi
          CONTENT=""
          ROLE_MENTIONS="[]"
          if [ -n "$ROLE_ID" ]; then
            CONTENT="<@&${ROLE_ID}>"
            ROLE_MENTIONS="[\"${ROLE_ID}\"]"
          fi
          jq -n \
            --arg content "$CONTENT" \
            --argjson roles "$ROLE_MENTIONS" \
            --arg title "🚀 New Release: ${REPO} v${TAG}" \
            --arg url "${URL}" \
            --arg description "${DESC}" \
            --arg author_name "${ACTOR}" \
            --arg author_icon "https://github.com/${ACTOR}.png" \
            --arg footer "Release published" \
            --arg timestamp "${TIMESTAMP}" \
            '{
              content: $content,
              allowed_mentions: { roles: $roles },
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 3447003,
                author: { name: $author_name, icon_url: $author_icon },
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }' | curl -fsS -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"

  prereleaseNotification:
    if: github.event.release.prerelease == true && secrets.DISCORD_RELEASE_WEBHOOK != ''
    name: Notify Discord - Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Send prerelease embed to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_RELEASE_ROLE_ID || secrets.DISCORD_ROLE_ID }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          ACTOR: ${{ github.actor }}
          TIMESTAMP: ${{ github.event.release.published_at }}
        run: |
          DESC="${BODY}"
          if [ ${#DESC} -gt 3800 ]; then
            DESC="${DESC:0:3800}"$'\n\n'"…(truncated; open the release for full notes)"
          fi
          CONTENT=""
          ROLE_MENTIONS="[]"
          if [ -n "$ROLE_ID" ]; then
            CONTENT="<@&${ROLE_ID}>"
            ROLE_MENTIONS="[\"${ROLE_ID}\"]"
          fi
          jq -n \
            --arg content "$CONTENT" \
            --argjson roles "$ROLE_MENTIONS" \
            --arg title "🧪 Pre-Release: ${REPO} ${TAG}" \
            --arg url "${URL}" \
            --arg description "${DESC}" \
            --arg author_name "${ACTOR}" \
            --arg author_icon "https://github.com/${ACTOR}.png" \
            --arg footer "Pre-release build" \
            --arg timestamp "${TIMESTAMP}" \
            '{
              content: $content,
              allowed_mentions: { roles: $roles },
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 15105570,
                author: { name: $author_name, icon_url: $author_icon },
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }' | curl -fsS -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"
