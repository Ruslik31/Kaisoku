name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        if: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE != '' }}
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble debug APKs
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE != '' && format('{0}/keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kaisoku-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
