name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  repository_dispatch:
    types: [source_pushed]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.client_payload.ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo || github.repository }}
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle for CI
        # Overrides the project's gradle.properties from the user home, so upstream files stay
        # untouched. R8 on the release build spent ~10 of ~16 minutes with a 4 GB heap; the
        # runner has 16 GB. Kotlin compiles inside the Gradle daemon so two JVMs do not compete
        # for memory, and the build cache lets unchanged tasks come from the restored Gradle cache.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx10g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

      - name: Create local.properties
        env:
          TG_TOKEN: ${{ secrets.TG_BACKUP_BOT_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$TG_TOKEN" ]; then
            echo "tg_backup_bot_token=$TG_TOKEN" >> local.properties
          fi

      - name: Mark experimental version
        # Pushes to this fork build the fork's own code, which carries changes upstream does not
        # have, so those builds get an "-experimental" version name. Builds dispatched from
        # upstream keep upstream's version name.
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          BASE=$(sed -n "s/^[[:space:]]*versionName = '\(.*\)'.*/\1/p" app/build.gradle)
          VERSION="${BASE}-experimental-${GITHUB_SHA::7}"
          sed -i "s/versionName = '${BASE}'/versionName = '${VERSION}'/" app/build.gradle
          echo "EXPERIMENTAL_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version name: ${VERSION}"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/keystore.jks"
          fi

      - name: Assemble debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/keystore.jks" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kaisoku-debug${{ env.EXPERIMENTAL_VERSION && format('-{0}', env.EXPERIMENTAL_VERSION) || '' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
