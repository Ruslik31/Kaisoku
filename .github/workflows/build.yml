name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  repository_dispatch:
    types: [source_pushed]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.client_payload.ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo || github.repository }}
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle for CI
        # Overrides the project's gradle.properties from the user home, so upstream files stay
        # untouched. R8 on the release build spent ~10 of ~16 minutes with a 4 GB heap; the
        # runner has 16 GB. Kotlin compiles inside the Gradle daemon so two JVMs do not compete
        # for memory, and the build cache lets unchanged tasks come from the restored Gradle cache.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx10g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

      - name: Create local.properties
        env:
          TG_TOKEN: ${{ secrets.TG_BACKUP_BOT_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$TG_TOKEN" ]; then
            echo "tg_backup_bot_token=$TG_TOKEN" >> local.properties
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/keystore.jks"
          fi

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug

      - name: Sign debug APKs with the fork key
        # Without this the debug APKs carry the runner's throwaway debug key, which differs on
        # every run, so one debug build cannot be installed over another.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::warning::KEYSTORE secret is not set, debug APKs keep the runner's debug key."
            exit 0
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          export KEY_PASS
          ALIAS_ARGS=()
          if [ -n "$KEY_ALIAS" ]; then
            ALIAS_ARGS=(--ks-key-alias "$KEY_ALIAS")
          fi
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/keystore.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              "${ALIAS_ARGS[@]}" \
              --key-pass env:KEY_PASS \
              "$apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Kaisoku-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
